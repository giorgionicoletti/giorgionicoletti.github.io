# Schools, workshops and research visits.
#
# This file is the single source for both the "Attended schools and workshops"
# list on the CV page and the school/visit pins on the talk map. They are kept
# out of the talks collection so that the Talks page still lists only talks,
# presentations and posters.
#
# type      : "School" or "Visit" — decides the pin colour and the CV section
# venue     : the school or institution, as it should appear
# title     : what it was (shown in italics in the map popup)
# location  : geocoded by _talks/talkmap.ipynb; "Online" is skipped on the map
# date      : ISO start date, used for sorting and for the map popup
# date_text : how the period reads on the CV
# url       : optional link

