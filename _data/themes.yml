# Research areas. The key must match the `theme:` field in _publications/*.md
# and _posts/*.md. Cards on the home page, filters on the publications page
# and the "area" colouring of the collaboration network are all built from
# this file and those fields.
# colour is used on the light theme, colour_dark on the dark theme (network, timeline, cards).
# Optional per area: image (and image_dark for the dark theme) shown as a banner on the card.
- key: information
  title: "Information in stochastic systems"
  question: "How do noisy systems harvest, propagate and pay for information?"
  topics: "Statistical physics, information theory, stochastic processes, stochastic thermodynamics"
  image: "/images/areas/information.svg"
  image_dark: "/images/areas/information-dark.svg"
  anchor: "/research/#information-head"
  colour: "#c9922c"
  colour_dark: "#d9a441"

- key: behaviour
